# husariabeats.com — nginx config
# Deploy to: /etc/nginx/sites-available/husariabeats.com.conf
# Enable:    sudo ln -s /etc/nginx/sites-available/husariabeats.com.conf /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo nginx -s reload
#
# TLS cert:  sudo certbot --nginx -d husariabeats.com -d www.husariabeats.com
#
# Ports:
#   frontend (Next.js)  → 127.0.0.1:3001
#   api (FastAPI)       → 127.0.0.1:8001
# NOTE: X-Frame-Options DENY is intentionally omitted — YouTube embeds require frames.


# ── 1. HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name husariabeats.com www.husariabeats.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── 2. HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name husariabeats.com www.husariabeats.com;

    ssl_certificate     /etc/letsencrypt/live/husariabeats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/husariabeats.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # X-Frame-Options intentionally omitted — YouTube iframes need this open

    client_max_body_size 5m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    90s;

    # ── API — FastAPI container ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend — Next.js container ────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
