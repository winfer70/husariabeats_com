# /etc/nginx/sites-available/husariabeats
# Main site — husariabeats.com
# TLS via Cloudflare Origin Certificate (15yr). Cloudflare proxy terminates
# browser TLS at edge; this cert is only verified by Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name husariabeats.com www.husariabeats.com;
    return 301 https://husariabeats.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name husariabeats.com www.husariabeats.com;

    ssl_certificate     /etc/ssl/husariabeats.pem;
    ssl_certificate_key /etc/ssl/husariabeats.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    # X-Frame-Options intentionally omitted — YouTube embeds need iframes

    client_max_body_size 5m;

    # API — FastAPI container on :8001
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend — Next.js container on :3001
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
