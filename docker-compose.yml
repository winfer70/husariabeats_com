# husariabeats.com — Docker Compose
# Educational companion site for Husaria Beats YouTube channel.
# Bilingual (PL/EN), timeline, album grid, community voting, release automation.
#
# Services:
#   frontend  — Next.js 14 public site      (127.0.0.1:3001)
#   api       — FastAPI backend             (127.0.0.1:8001)
#   admin     — Next.js admin panel         (127.0.0.1:3002, Cloudflare Access protected)
#   db        — PostgreSQL 16               (internal only)
#   redis     — Redis 7 vote dedup cache    (internal only)
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d --build
#   docker compose logs -f

networks:
  husariabeats_net:
    driver: bridge

services:

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://husariabeats.com/api
      - INTERNAL_API_URL=http://api:8000
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - NEXT_PUBLIC_STATS_INSTAGRAM=${NEXT_PUBLIC_STATS_INSTAGRAM}
      - NEXT_PUBLIC_STATS_TIKTOK=${NEXT_PUBLIC_STATS_TIKTOK}
      - NEXT_PUBLIC_STATS_FACEBOOK=${NEXT_PUBLIC_STATS_FACEBOOK}
    depends_on:
      - api
    networks:
      - husariabeats_net

  api:
    build: ./api
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-husariabeats}"
      RESEND_API_KEY: ${RESEND_API_KEY}
      UPLOAD_POST_API_KEY: ${UPLOAD_POST_API_KEY}
      UPLOAD_POST_PROFILE: ${UPLOAD_POST_PROFILE}
      RELEASES_BASE_URL: ${RELEASES_BASE_URL}
      N8N_RELEASE_WEBHOOK_URL: ${N8N_RELEASE_WEBHOOK_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL}
    volumes:
      - ./releases:/releases
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - husariabeats_net

  admin:
    build: ./admin
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      # Internal Docker network URL for server-side API calls
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api
      - db
    networks:
      - husariabeats_net

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-husariabeats}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout:  5s
      retries:  5
    networks:
      - husariabeats_net

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - husariabeats_net

volumes:
  postgres_data:
  redis_data:
